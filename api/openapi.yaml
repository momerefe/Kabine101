'openapi': '3.0.3'
'info':
  'title': 'KoçBenefits API'
  'version': '0.5.0'
  'description': '3C administrator partnership and benefit management. Lists return at most 1000 matching rows with truncated=true when additional matching records exist. Dates use Europe/Istanbul, inclusive end day. Optional text and dates use empty strings. PUT revision 0 creates a client-selected UUID; all edits require the current revision, reset benefit publication to draft and clear approval. Existing benefit business_id is immutable. Eligible accounts also have a published student catalogue, private favorites and active-only redemption. Student lists and details never include redemption payloads.'
'paths':
  /api/admin/audit:
    get:
      operationId: getAdminAudit
      description: Read-only administrator audit log. Dates inclusive in Europe/Istanbul. No secrets or mutation endpoints. Fifty rows per page.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Login required or failed reauthentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Current state or revision conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
            x-go-type: string
        - name: until
          in: query
          schema:
            type: string
            format: date
            x-go-type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
  /api/admin/settings:
    get:
      operationId: getAdminSettings
      description: Administrator settings. School domain is deployment configuration and read-only.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettingsResponse'
        '400':
          description: Invalid input
