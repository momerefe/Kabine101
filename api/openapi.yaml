'openapi': '3.0.3'
'info':
  'title': 'KoçBenefits API'
  'version': '0.5.0'
  'description': '3C administrator partnership and benefit management. Lists return at most 1000 matching rows with truncated=true when additional matching records exist. Dates use Europe/Istanbul, inclusive end day. Optional text and dates use empty strings. PUT revision 0 creates a client-selected UUID; all edits require the current revision, reset benefit publication to draft and clear approval. Existing benefit business_id is immutable. Eligible accounts also have a published student catalogue, private favorites and active-only redemption. Student lists and details never include redemption payloads.'
'paths':
  /api/admin/purchases:
    get:
      operationId: getAdminPurchases
      description: Administrator only. Up to 1000 records; truncated indicates additional rows.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseList'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate reference or conflicting state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
    post:
      operationId: createPurchase
      description:
        Administrator records a pending purchase. Eligible student and published benefit required. Receipt reference is normalized and unique per business
        across all statuses. Retry with identical client UUID is safe; conflicting input returns 409. Amounts are immutable; an administrator must explicitly approve
        the purchase.
      security:
        - sessionCookie: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Login required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate reference or conflicting state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Identical client UUID replay; no additional record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreate'
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
  /api/admin/purchases/{id}/review:
    post:
      operationId: reviewPurchase
      description:
        Administrator with current session and CSRF. pending -> approved/rejected; approved -> revoked only. Rejection/revocation require a reason. Repeated
