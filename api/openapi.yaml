'components':
  'securitySchemes':
    'sessionCookie':
      'type': 'apiKey'
      'in': 'cookie'
      'name': 'kb_session'
      'description': 'Opaque session; production cookie __Host-kb_session.'
  'schemas':
    'Health':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'status'
      'properties':
        'status':
          'type': 'string'
          'enum':
            - 'ok'
            - 'unavailable'
    'Account':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'id'
        - 'name'
        - 'email'
        - 'username'
        - 'role'
        - 'status'
        - 'email_verified'
        - 'eligibility_status'
      'properties':
        'id':
          'type': 'string'
        'name':
          'type': 'string'
        'email':
          'type': 'string'
          'description': 'Empty for an operator account; no fabricated email.'
        'username':
          'type': 'string'
          'description': 'Operator login name; empty for school email accounts.'
        'role':
          'type': 'string'
          'enum':
            - 'student'
            - 'admin'
        'status':
          'type': 'string'
          'enum':
            - 'pending'
            - 'active'
            - 'rejected'
            - 'disabled'
        'email_verified':
          'type': 'boolean'
        'eligibility_status':
          'type': 'string'
          'enum':
            - 'pending'
            - 'approved'
            - 'rejected'
    'SessionResponse':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'user'
        - 'csrf_token'
        - 'school_domain'
        - 'registration_open'
        - 'local_email'
      'properties':
        'user':
          'allOf':
            - '$ref': '#/components/schemas/Account'
          'nullable': true
        'csrf_token':
          'type': 'string'
        'school_domain':
          'type': 'string'
        'registration_open':
          'type': 'boolean'
        'local_email':
          'type': 'boolean'
    'LoginResponse':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'user'
      'properties':
        'user':
          '$ref': '#/components/schemas/Account'
    'AccountsResponse':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'accounts'
      'properties':
        'accounts':
