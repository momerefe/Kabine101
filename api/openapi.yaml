'components':
  'securitySchemes':
    'sessionCookie':
      'type': 'apiKey'
      'in': 'cookie'
      'name': 'kb_session'
      'description': 'Opaque session; production cookie __Host-kb_session.'
  'schemas':
    'Health':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'status'
      'properties':
        'status':
          'type': 'string'
          'enum':
            - 'ok'
            - 'unavailable'
    'Account':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'id'
        - 'name'
        - 'email'
        - 'username'
        - 'role'
        - 'status'
        - 'email_verified'
        - 'eligibility_status'
      'properties':
        'id':
          'type': 'string'
        'name':
          'type': 'string'
        'email':
          'type': 'string'
          'description': 'Empty for an operator account; no fabricated email.'
        'username':
          'type': 'string'
          'description': 'Operator login name; empty for school email accounts.'
        'role':
          'type': 'string'
          'enum':
            - 'student'
            - 'admin'
        'status':
          'type': 'string'
          'enum':
            - 'pending'
            - 'active'
            - 'rejected'
            - 'disabled'
        'email_verified':
          'type': 'boolean'
        'eligibility_status':
          'type': 'string'
          'enum':
            - 'pending'
            - 'approved'
            - 'rejected'
    'SessionResponse':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'user'
        - 'csrf_token'
        - 'school_domain'
        - 'registration_open'
        - 'local_email'
      'properties':
        'user':
          'allOf':
            - '$ref': '#/components/schemas/Account'
          'nullable': true
        'csrf_token':
          'type': 'string'
        'school_domain':
          'type': 'string'
        'registration_open':
          'type': 'boolean'
        'local_email':
          'type': 'boolean'
    'LoginResponse':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'user'
      'properties':
        'user':
          '$ref': '#/components/schemas/Account'
    'AccountsResponse':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'accounts'
      'properties':
        'accounts':
          'type': 'array'
          'items':
            '$ref': '#/components/schemas/Account'
    'Message':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'message'
      'properties':
        'message':
          'type': 'string'
    'Error':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'code'
        - 'message'
      'properties':
        'code':
          'type': 'string'
        'message':
          'type': 'string'
    'RegisterRequest':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'name'
        - 'email'
        - 'password'
      'properties':
        'name':
          'type': 'string'
        'email':
          'type': 'string'
        'password':
          'type': 'string'
    'LoginRequest':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'email'
        - 'password'
      'properties':
        'email':
          'type': 'string'
        'password':
          'type': 'string'
    'AdminLoginRequest':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'username'
        - 'password'
      'properties':
        'username':
          'type': 'string'
        'password':
          'type': 'string'
    'EmailRequest':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'email'
      'properties':
        'email':
          'type': 'string'
    'TokenRequest':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'token'
      'properties':
        'token':
          'type': 'string'
    'ResetPasswordRequest':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'token'
        - 'password'
      'properties':
        'token':
          'type': 'string'
        'password':
          'type': 'string'
    'ReviewRequest':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'decision'
        - 'current_password'
      'properties':
        'decision':
          'type': 'string'
          'enum':
            - 'approved'
            - 'rejected'
        'current_password':
          'type': 'string'
    'RoleRequest':
      'type': 'object'
      'additionalProperties': false
      'required':
        - 'role'
        - 'current_password'
      'properties':
        'role':
          'type': 'string'
          'enum':
            - 'student'
            - 'admin'
        'current_password':
          'type': 'string'
    'EmptyRequest':
      'type': 'object'
      'additionalProperties': false
      'required': []
      'properties': {}
