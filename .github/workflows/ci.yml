name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 18 without containers
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18
          # Use a unique cluster/port independent of the runner's installed cluster.
          sudo pg_createcluster 18 kocbenefits --port=55432 --start
          sudo -u postgres psql -p 55432 -v ON_ERROR_STOP=1 -c "CREATE ROLE runner LOGIN PASSWORD 'ci-only-password' NOSUPERUSER;"
          sudo -u postgres createdb -p 55432 -O runner kocbenefits_test
      - run: go test ./...
      - run: go test -tags=integration ./internal/migrations ./internal/auth ./internal/management ./internal/student -count=1
        env:
          TEST_DATABASE_URL: postgres://runner:ci-only-password@127.0.0.1:55432/kocbenefits_test?sslmode=disable
      - run: go vet ./...
      - run: go build ./...
      - run: pnpm check && pnpm build && pnpm format:check
      - name: Student browser acceptance with real API
        run: |
          export KOC_CHROME="$(command -v google-chrome || command -v chromium)"
          go test -tags=integration ./internal/student -run '^TestStudentBrowser$' -count=1 -v
        env:
          KOC_STUDENT_BROWSER: '1'
          TEST_DATABASE_URL: postgres://runner:ci-only-password@127.0.0.1:55432/kocbenefits_test?sslmode=disable
      - name: Management 3E browser acceptance with real API
        run: |
          export KOC_CHROME="$(command -v google-chrome || command -v chromium)"
          go test -tags=integration ./internal/management -run '^TestManagement3EBrowser$' -count=1 -v
        env:
          KOC_MANAGEMENT3E_BROWSER: '1'
          TEST_DATABASE_URL: postgres://runner:ci-only-password@127.0.0.1:55432/kocbenefits_test?sslmode=disable
      - name: Check generated files
        run: |
          go tool oapi-codegen --config api/codegen.yaml api/openapi.yaml
          go tool sqlc generate
          pnpm generate:api
          git diff --exit-code -- internal/api internal/database web/src/api/schema.gen.ts
